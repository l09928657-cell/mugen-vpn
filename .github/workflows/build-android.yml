name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'android'
          arch: 'android_arm64_v8a'
      - name: Create minimal libxray.aar
        run: |
          mkdir -p client/android/xray/libXray /tmp/aar-stub
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="go.tun2socks"></manifest>' > /tmp/aar-stub/AndroidManifest.xml
          cd /tmp/aar-stub && zip -r /tmp/libxray.aar AndroidManifest.xml
          cp /tmp/libxray.aar client/android/xray/libXray/libxray.aar
      - name: Build APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MugenVPN-debug
          path: client/android/app/build/outputs/apk/debug/*.apk
