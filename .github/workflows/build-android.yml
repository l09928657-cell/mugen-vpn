name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download libxray.aar
        run: |
          gh release download 4.8.15.4 \
            --repo amnezia-vpn/amnezia-client \
            --pattern "libxray.aar" \
            --output client/android/xray/libXray/libxray.aar || \
          wget -O client/android/xray/libXray/libxray.aar \
            "https://github.com/amnezia-vpn/amnezia-client/releases/download/4.8.15.4/libxray.aar"
          ls -lh client/android/xray/libXray/libxray.aar
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Build APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MugenVPN-debug
          path: client/android/app/build/outputs/apk/debug/*.apk
